<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сайт Максима</title>
    <style>
        body {
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        h1 {
            color: #58a6ff;
        }
        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2ea043;
        }
        .projects {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .projects h2 {
            color: #58a6ff;
            text-align: center;
            margin-bottom: 30px;
        }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
        }
        .project-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 24px;
            text-align: center;
            transition: transform 0.25s,border-color 0.25s;
            display: block;
            text-decoration: none;
            color: inherit;
        }
        .project-card:hover {
            transform: scale(1.05);
            border-color: #58a6ff;
        }
        .project-card .emoji {
            font-size: 36px;
            margin-bottom: 10px;
        }
        .project-card p {
            color: #8b949e;
            font-size: 14px;
            margin: 8px 0 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привет! Я Максим</h1>
        <p>Начинающий разработчик. Это мой первый сайт.</p>
        <button onclick="window.open('https://t.me/Pandakak12')">Связаться со мной</button>
    </div>
    <section class="projects">
    <h2>Мои проекты</h2>
    <div class="project-grid">
        <a class="project-card" href="https://github.com" target="_blank">
            <div class="emoji">🎮</div>
            <b>Калькулятор</b>
            <p>Первый проект на JavaScript</p>
        </a>
        <a class="project-card" href="https://t.me/Pandakak12" target="_blank">
            <div class="emoji">🌐</div>
            <b>Этот сайт</b>
            <p>Моё портфолио с нуля</p>
        </a>
        <a class="project-card" href="https://budilki.ru" target="_blank">
            <div class="emoji">⏱️</div>
            <b>Таймер Pomodoro</b>
            <p>Скоро начну делать</p>
        </a>
    </div>
</section>
</body>
</html>
